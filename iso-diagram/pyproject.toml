[project]
name = "iso-diagram"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "brotli>=1.2.1",
    "fonttools>=4.67.0",
    "truststore>=0.10.5",
]

[project.scripts]
iso-build = "iso_diagram.build:main"
iso-palette = "iso_diagram.palette:main"
iso-icons = "iso_diagram.icons:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
# Lets isort classify iso_diagram as first-party.
src = ["src"]
# The formatter wraps at 88. E501 (below) tolerates up to 100 for what the
# formatter cannot wrap: long strings, URLs, and comments.
line-length = 88
indent-width = 4
# Without this, `exclude` entries are ignored for paths passed explicitly
# (e.g. by pre-commit or `ruff check tests/`) and only apply to bare `ruff check`.
force-exclude = true
# No target-version: ruff infers it from `requires-python`.

[tool.ruff.lint]
preview = true
select = [
  "A",       # flake8-builtins
  "ARG",     # flake8-unused-arguments
  "B",       # flake8-bugbear
  "COM",     # flake8-commas
  "C4",      # flake8-comprehensions
  "C90",     # mccabe complexity
  "D",       # pydocstyle
  "E1",      # indentation
  "E2",      # whitespace
  "E3",      # blank lines
  "E4",      # import errors
  "E5",      # line length
  "E7",      # statement errors
  "E9",      # runtime errors
  "F",       # pyflakes
  "I",       # isort
  "N",       # pep8-naming
  "PERF",    # Perflint
  "too-many-branches",             # PLR0912
  "too-many-arguments",            # PLR0913
  "too-many-statements",           # PLR0915
  "too-many-positional-arguments", # PLR0917
  "PTH",     # flake8-use-pathlib
  "Q",       # flake8-quotes
  "RET",     # flake8-return
  "RUF",     # ruff
  "SIM",     # flake8-simplify
  "TID",     # flake8-tidy-imports
  "UP",      # pyupgrade
]
# Annotation rules follow the typing mode in [tool.pyright] typeCheckingMode:
# off = none, basic = public return types only, standard and strict = ["ANN"].
extend-select = ["ANN"]

ignore = [
  "missing-trailing-comma",            # Conflicts with the formatter's own trailing-comma handling
  "incorrect-blank-line-before-class", # 1 blank line required before class docstring
  "multi-line-summary-second-line",    # Multi-line docstring summary should start at the second line
  "any-type", # Allow Any in annotations (typing mode: standard)
]

[tool.ruff.lint.per-file-ignores]
# Tests are linted, but they do not need docstrings, annotations, or lean
# signatures: fixtures arrive as arguments, and a test's name is its docstring.
"tests/**" = [
  "D",
  "ANN",
  "ARG",
  "too-many-arguments",
  "too-many-positional-arguments",
]

[tool.ruff.lint.flake8-annotations]
# Don't require type annotations for __init__ methods.
mypy-init-return = true

[tool.ruff.lint.flake8-tidy-imports]
# Disallow all relative imports.
ban-relative-imports = "all"

[tool.ruff.lint.isort]
# Combine as imports on the same line
combine-as-imports = true
# Use a single line after each import block.
lines-after-imports = 2
# Use a single line between direct and from import.
lines-between-types = 1
# Order imports by type (standard library, third-party, first-party).
order-by-type = true

[tool.ruff.lint.mccabe]
# A function over this is doing too much. Decompose it; don't raise the limit.
max-complexity = 10

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50
# Public functions take keyword-only arguments (a bare `*`), so few
# positional parameters should ever be needed.
max-positional-args = 3

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

line-ending = "lf"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
docstring-code-format = true

# Set the line length limit used when formatting docstring code snippets.
docstring-code-line-length = "dynamic"
